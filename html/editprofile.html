<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Student Hub Portal</title>
    <link rel="stylesheet" href="../Style css/style.css">
</head>

<body>

<div class="dashboard">

    <!-- ================================================= -->
    <!--                     SIDEBAR                        -->
    <!-- ================================================= -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-header">
            <h2>StudentHub</h2>
        </div>

        <!-- Scrollable nav links -->
        <nav class="sidebar-links">

            <a href="dashboard.html">Dashboard</a>
            <a href="profile.html" class="active">Profile</a>
            <a href="attendance.html">Attendance</a>
            <a href="courses.html">Courses</a>
            <a href="assignments.html">Assignments</a>
            <a href="studymaterials.html">Study Material</a>
            <a href="timetable.html">Timetable</a>
            <a href="results.html">Results</a>
            <a href="library.html">Library</a>
            <a href="placement.html">Placement</a>
            <a href="noticeboard.html">Notice Board</a>

        </nav>

        <!-- Logout pinned to bottom-left of sidebar -->
        <div class="sidebar-footer">
            <a href="logout.html">Logout</a>
        </div>

    </aside>

    <!-- ================================================= -->
    <!--                  MAIN CONTENT                      -->
    <!-- ================================================= -->

    <main class="main-content" id="mainContent">

        <!-- ============== TOP BAR ============== -->
        <div class="topbar">

            <div style="display:flex; align-items:center; gap:15px;">

                <!-- Sidebar toggle button -->
                <button id="sidebarToggle" class="toggle-btn" aria-label="Toggle sidebar">
                    &#9776;
                </button>

                <div>
                    <h1>Edit Profile</h1>
                    <p>Update your personal and academic information.</p>
                </div>

            </div>

            <div style="display:flex; align-items:right; gap:20px;">


                <a href="notifications.html">🔔 Notifications</a>

            </div>

        </div>

        <!-- ============== EDIT PROFILE FORM ============== -->
        <form action="profile.html" method="post">

            <!-- ---------- Profile Photo ---------- -->
            <div class="card">

                <h2>Profile Photo</h2>
                <br>

                <div class="photo-edit-row">

                    <div class="profile-avatar">
                        <img src="student-photo.png" alt="Current Student Photo">
                    </div>

                    <div class="photo-upload">
                        <label for="studentPhoto">Change Photo</label>
                        <input type="file" id="studentPhoto" name="studentPhoto">
                    </div>

                </div>

            </div>

            <br>

            <!-- ---------- Personal Information ---------- -->
            <div class="card">

                <h2>Personal Information</h2>
                <br>

                <div class="form-fields-grid">

                    <div class="form-field">
                        <label for="name">Name</label>
                        <input
    type="text"
    id="editName"
    name="name"
>
                    </div>

                    <div class="form-field">
                        <label for="email">Email</label>
                        <input
    type="email"
    id="editEmail"
    name="email"
    readonly
>
                    </div>

                    <div class="form-field">
                        <label for="mobile">Mobile</label>
                       <input
    type="text"
    id="editMobile"
    name="mobile"
>
                    </div>

                    <div class="form-field">
                        <label for="address">Address</label>
                        <input type="text" id="address" name="address" placeholder="Enter your address">
                    </div>

                </div>

            </div>

            <br>

            <!-- ---------- Academic Information ---------- -->
            <div class="card">

                <h2>Academic Information</h2>
                <br>

                <div class="form-fields-grid">

                    <div class="form-field">
                        <label for="enrollment">Enrollment Number</label>
                        <input
    type="text"
    id="editEnrollment"
    name="enrollment"
>
                    </div>

                    <div class="form-field">
                        <label for="department">Department</label>
                       <input
    type="text"
    id="editCourse"
    name="course"
>
                    </div>

                    <div class="form-field">
                        <label for="semester">Semester</label>
                        <input
    type="text"
    id="editSemester"
    name="semester"
>
                    </div>

                    <div class="form-field">
                        <label for="batch">Batch / Year</label>
                        <input type="text" id="batch" name="batch" placeholder="e.g. 2023-2027">
                    </div>

                </div>

            </div>

            <br>

            <!-- ---------- Form Actions ---------- -->
            <div class="card">

                <div class="account-actions">
                    <button type="submit">Save Changes</button>
                    <a href="profile.html"><button type="button" class="btn-secondary">Cancel</button></a>
                </div>

            </div>

        </form>

    </main>

</div>


<script src="../JavaScript/script.js"></script>
<script src="../JavaScript/studentData.js"></script>

<script>

document.addEventListener(
    "DOMContentLoaded",
    async function () {

        /*
        ==========================================
        MAKE SURE STUDENT DATA IS LOADED
        ==========================================
        */

        await initializeStudentData();


        /*
        ==========================================
        GET CURRENT LOGGED-IN STUDENT
        ==========================================
        */

        const student = getCurrentStudent();


        /*
        ==========================================
        IF NO STUDENT IS LOGGED IN
        ==========================================
        */

        if (!student) {

            alert("Please login first.");

            window.location.href =
                "login.html";

            return;
        }


        /*
        ==========================================
        FETCH STUDENT DATA INTO FORM
        ==========================================
        */

        const nameInput =
            document.getElementById("editName");

        const emailInput =
            document.getElementById("editEmail");

        const mobileInput =
            document.getElementById("editMobile");

        const courseInput =
            document.getElementById("editCourse");

        const semesterInput =
            document.getElementById("editSemester");

        const enrollmentInput =
            document.getElementById("editEnrollment");

        const cityInput =
            document.getElementById("editCity");

        const genderInput =
            document.getElementById("editGender");


        /*
        ==========================================
        PUT DATA INTO INPUT BOXES
        ==========================================
        */

        if (nameInput) {
            nameInput.value =
                student.name || "";
        }


        if (emailInput) {
            emailInput.value =
                student.email || "";
        }


        if (mobileInput) {
            mobileInput.value =
                student.mobile || "";
        }


        if (courseInput) {
            courseInput.value =
                student.course || "";
        }


        if (semesterInput) {
            semesterInput.value =
                student.semester || "";
        }


        if (enrollmentInput) {
            enrollmentInput.value =
                student.enrollment || "";
        }


        if (cityInput) {
            cityInput.value =
                student.city || "";
        }


        if (genderInput) {
            genderInput.value =
                student.gender || "";
        }


        /*
        ==========================================
        SAVE UPDATED PROFILE
        ==========================================
        */

        const editProfileForm =
            document.getElementById(
                "editProfileForm"
            );


        if (!editProfileForm) {
            return;
        }


        editProfileForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                /*
                Collect updated values
                */

                const updatedStudent = {

                    name:
                        nameInput
                            ? nameInput.value.trim()
                            : student.name,

                    email:
                        emailInput
                            ? emailInput.value.trim()
                            : student.email,

                    mobile:
                        mobileInput
                            ? mobileInput.value.trim()
                            : student.mobile,

                    course:
                        courseInput
                            ? courseInput.value.trim()
                            : student.course,

                    semester:
                        semesterInput
                            ? semesterInput.value.trim()
                            : student.semester,

                    enrollment:
                        enrollmentInput
                            ? enrollmentInput.value.trim()
                            : student.enrollment,

                    city:
                        cityInput
                            ? cityInput.value.trim()
                            : student.city,

                    gender:
                        genderInput
                            ? genderInput.value
                            : student.gender

                };


                /*
                ==================================
                SAVE TO LOCAL STORAGE
                ==================================
                */

                const updated =
                    updateStudent(
                        updatedStudent
                    );


                if (updated) {

                    alert(
                        "Profile updated successfully!"
                    );


                    /*
                    Go back to profile
                    */

                    window.location.href =
                        "profile.html";

                } else {

                    alert(
                        "Unable to update profile."
                    );

                }

            }
        );

    }

);

</script>
</body>

</html>
