<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Profile - Student Hub Portal</title>

</head>


<body>


<!-- ===================================================== -->
<!--              STUDENT HUB PORTAL HEADER               -->
<!-- ===================================================== -->

<table border="1"
       width="100%"
       cellspacing="0"
       cellpadding="10">


    <tr>

        <td align="center">


            <!-- Logo -->

            <img src="logo.png"
                 alt="Student Hub Portal Logo"
                 width="50">


            <!-- Portal Name -->

            <h1>
                Student Hub Portal
            </h1>


        </td>

    </tr>


</table>


<br>


<!-- ===================================================== -->
<!--          SIDEBAR + EDIT PROFILE CONTENT               -->
<!-- ===================================================== -->

<table width="100%"
       cellspacing="10"
       cellpadding="10">


    <tr>


        <!-- ================= SIDEBAR ================= -->

        <td width="25%"
            valign="top">


            <table border="1"
                   width="100%"
                   cellspacing="0"
                   cellpadding="12">


                <tr>

                    <td>

                        <b>
                            Sidebar
                        </b>

                    </td>

                </tr>


                <tr>

                    <td>

                        <a href="dashboard.html">
                            Dashboard
                        </a>

                    </td>

                </tr>


                <tr>

                    <td>

                        <a href="profile.html">
                            Profile
                        </a>

                    </td>

                </tr>


                <tr>

                    <td>

                        <a href="attendance.html">
                            Attendance
                        </a>

                    </td>

                </tr>


                <tr>

                    <td>

                        <a href="courses.html">
                            Courses
                        </a>

                    </td>

                </tr>


                <tr>

                    <td>

                        <a href="assignments.html">
                            Assignments
                        </a>

                    </td>

                </tr>


                <tr>

                    <td>

                        <a href="study-material.html">
                            Study Material
                        </a>

                    </td>

                </tr>


                <tr>

                    <td>

                        <a href="timetable.html">
                            Timetable
                        </a>

                    </td>

                </tr>


                <tr>

                    <td>

                        <a href="results.html">
                            Results
                        </a>

                    </td>

                </tr>


                <tr>

                    <td>

                        <a href="library.html">
                            Library
                        </a>

                    </td>

                </tr>


                <tr>

                    <td>

                        <a href="placement.html">
                            Placement
                        </a>

                    </td>

                </tr>


                <tr>

                    <td>

                        <a href="notice-board.html">
                            Notice Board
                        </a>

                    </td>

                </tr>


                <tr>

                    <td>

                        <a href="contact.html">
                            Contact
                        </a>

                    </td>

                </tr>


                <tr>

                    <td>

                        <a href="logout.html">
                            Logout
                        </a>

                    </td>

                </tr>


            </table>


        </td>


        <!-- ================= EDIT PROFILE CONTENT ================= -->

        <td width="75%"
            valign="top">


            <h2>
                Edit Profile
            </h2>


            <!-- Profile Editing Form -->

            <form action="profile.html"
                  method="post">


                <table border="1"
                       width="100%"
                       cellspacing="0"
                       cellpadding="12">


                    <!-- Profile Photo -->

                    <tr>


                        <td width="30%">

                            <b>
                                Profile Photo
                            </b>

                        </td>


                        <td>


                            <img src="student-photo.png"
                                 alt="Current Student Photo"
                                 width="100"
                                 height="100">


                            <br>
                            <br>


                            <label>
                                Change Photo:
                            </label>


                            <input type="file"
                                   name="studentPhoto">


                        </td>


                    </tr>


                    <!-- Name -->

                    <tr>


                        <td>

                            <label for="name">

                                <b>
                                    Name
                                </b>

                            </label>

                        </td>


                        <td>

                            <input type="text"
                                   id="name"
                                   name="name"
                                   value="Student Name"
                                   size="40">

                        </td>


                    </tr>


                    <!-- Enrollment -->

                    <tr>


                        <td>

                            <label for="enrollment">

                                <b>
                                    Enrollment
                                </b>

                            </label>

                        </td>


                        <td>

                            <input type="text"
                                   id="enrollment"
                                   name="enrollment"
                                   value="20260001"
                                   size="40">

                        </td>


                    </tr>


                    <!-- Email -->

                    <tr>


                        <td>

                            <label for="email">

                                <b>
                                    Email
                                </b>

                            </label>

                        </td>


                        <td>

                            <input type="email"
                                   id="email"
                                   name="email"
                                   value="student@example.com"
                                   size="40">

                        </td>


                    </tr>


                    <!-- Mobile -->

                    <tr>


                        <td>

                            <label for="mobile">

                                <b>
                                    Mobile
                                </b>

                            </label>

                        </td>


                        <td>

                            <input type="tel"
                                   id="mobile"
                                   name="mobile"
                                   value="9876543210"
                                   size="40">

                        </td>


                    </tr>


                    <!-- Department -->

                    <tr>


                        <td>

                            <label for="department">

                                <b>
                                    Department
                                </b>

                            </label>

                        </td>


                        <td>

                            <input type="text"
                                   id="department"
                                   name="department"
                                   value="Computer Science"
                                   size="40">

                        </td>


                    </tr>


                    <!-- Semester -->

                    <tr>


                        <td>

                            <label for="semester">

                                <b>
                                    Semester
                                </b>

                            </label>

                        </td>


                        <td>

                            <input type="text"
                                   id="semester"
                                   name="semester"
                                   value="Semester 4"
                                   size="40">

                        </td>


                    </tr>


                </table>


                <br>


                <!-- Buttons -->

                <button type="submit">

                    Save Changes

                </button>


                &nbsp;&nbsp;


                <a href="profile.html">

                    <button type="button">

                        Cancel

                    </button>

                </a>


            </form>


        </td>


    </tr>


</table>


</body>

</html>
