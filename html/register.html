<!DOCTYPE html>
<html>

<head>
    <title>Registration - StudentHub Portal</title>
    <link rel="stylesheet" href="../Style css/style.css">
</head>

<body>

    <br><br>

    <table border="1" align="center" cellpadding="20" width="450">

        <tr>
            <td>

                <h2 align="center">REGISTRATION</h2>

                <form id="registrationForm">

                    <br>

                    <label>Name</label>
                    <input type="text" id="name" size="55">

                    <br><br>

                    <label>Enrollment Number</label>
                    <input type="text" id="enrollment" size="55">

                    <br><br>

                    <label>Email</label>
                    <input type="email" id="email" size="55">

                    <br><br>

                    <label>Mobile Number</label>
                    <input type="tel" id="mobile" size="55" maxlength="10">

                    <br><br>

                    <label>Department</label>
                    <input type="text" id="department" size="55">

                    <br><br>

                    <label>Semester</label>
                    <input type="text" id="semester" size="55">

                    <br><br>

                    <label>Password</label>
                    <input type="password" id="password" size="55">

                    <br><br>

                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" size="55">

                    <br><br>

                    <p align="center">

                        <button type="submit">
                            Register
                        </button>

                        <br><br>

                        Already have an account?

                        <a href="login.html">Login</a>

                    </p>

                </form>

            </td>
        </tr>

    </table>

    <!-- External JavaScript -->
    <script src="../JavaScript/script.js"></script>
    <script src="../JavaScript/studentData.js"></script>


<script>
document.getElementById("registrationForm").addEventListener(
    "submit",
    async function (event) {
        event.preventDefault();

        const password = document.getElementById("password").value;
        const confirmPassword =
            document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {
            alert("Passwords do not match.");
            return;
        }

        const student = {
            name: document.getElementById("name").value.trim(),
            enrollment: document.getElementById("enrollment").value.trim(),
            email: document.getElementById("email").value.trim(),
            mobile: document.getElementById("mobile").value.trim(),
            course: document.getElementById("department").value.trim(),
            semester: document.getElementById("semester").value.trim(),
            password: password
        };

        try {
            const response = await fetch("../PHP/register.php", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(student)
            });

            const result = await response.json();
            alert(result.message);

            if (response.ok && result.success) {
                window.location.href = "login.html";
            }
        } catch (error) {
            alert("Cannot connect to the server. Check XAMPP.");
        }
    }
);
</script>
</body>

</html>
