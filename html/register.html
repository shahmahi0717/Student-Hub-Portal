
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - StudentHub Portal</title>
    <link rel="stylesheet" href="../Style css/style.css">
</head>
<body>

    <br><br>

    <table border="1" align="center" cellpadding="20" width="450">
        <tr>
            <td>
                <h2 align="center">REGISTRATION</h2>

                <form id="registrationForm">
                    <label for="name">Name</label><br>
                    <input type="text" id="name" required><br><br>

                    <label for="enrollment">Enrollment Number</label><br>
                    <input type="text" id="enrollment" required><br><br>

                    <label for="email">Email</label><br>
                    <input type="email" id="email" required><br><br>

<label for="role">Select Role:</label>

<select id="role" name="role" required>
    <option value="">-- Select Your Role --</option>
    <option value="Student">Student</option>
    <option value="Faculty">Faculty</option>
    <option value="Admin">Admin</option>
</select>


                    <label for="mobile">Mobile Number</label><br>
                    <input type="tel" id="mobile"
                           maxlength="10" pattern="[0-9]{10}" required><br><br>

                    <label for="department">Department</label><br>
                    <input type="text" id="department" required><br><br>

                    <label for="semester">Semester</label><br>
                    <input type="number" id="semester"
                           min="1" max="12" required><br><br>

                    <label for="password">Password</label><br>
                    <input type="password" id="password"
                           minlength="8" required><br><br>

                    <label for="confirmPassword">Confirm Password</label><br>
                    <input type="password" id="confirmPassword"
                           minlength="8" required><br><br>

                    <p align="center">
                        <button type="submit">Register</button>
                        <br><br>
                        Already have an account?
                        <a href="login.html">Login</a>
                    </p>
                </form>
            </td>
        </tr>
    </table>

    <script>
    document.getElementById("registrationForm").addEventListener(
        "submit", async function(event) {
            event.preventDefault();

            const password = document.getElementById("password").value;
            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                alert("Passwords do not match.");
                return;
            }

            const student = {
                name: document.getElementById("name").value.trim(),
                enrollment: document.getElementById("enrollment").value.trim(),
                email: document.getElementById("email").value.trim(),
                mobile: document.getElementById("mobile").value.trim(),
                course: document.getElementById("department").value.trim(),
                semester: document.getElementById("semester").value,
                password: password
            };

            try {
                const response = await fetch("../PHP/register.php", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(student)
                });

                const result = await response.json();
                alert(result.message);

                if (response.ok && result.success) {
                    window.location.href = "login.html";
                }
            } catch (error) {
                alert("Cannot connect to the server. Check XAMPP.");
            }
        }
    );
    </script>

</body>
</html>
