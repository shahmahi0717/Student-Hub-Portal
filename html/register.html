<!DOCTYPE html>
<html>

<head>
    <title>Registration - StudentHub Portal</title>
    <link rel="stylesheet" href="C:\Users\shahm\OneDrive\Desktop\Student Hub Portal\Style css\style.css">
</head>

<body>

    <br><br>

    <table border="1" align="center" cellpadding="20" width="450">

        <tr>
            <td>

                <h2 align="center">REGISTRATION</h2>

                <form id="registrationForm">

                    <br>

                    <label>Name</label>
                    <input type="text" id="name" size="55">

                    <br><br>

                    <label>Enrollment Number</label>
                    <input type="text" id="enrollment" size="55">

                    <br><br>

                    <label>Email</label>
                    <input type="email" id="email" size="55">

                    <br><br>

                    <label>Mobile Number</label>
                    <input type="tel" id="mobile" size="55" maxlength="10">

                    <br><br>

                    <label>Department</label>
                    <input type="text" id="department" size="55">

                    <br><br>

                    <label>Semester</label>
                    <input type="text" id="semester" size="55">

                    <br><br>

                    <label>Password</label>
                    <input type="password" id="password" size="55">

                    <br><br>

                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" size="55">

                    <br><br>

                    <p align="center">

                        <button type="submit">
                            Register
                        </button>

                        <br><br>

                        Already have an account?

                        <a href="login.html">Login</a>

                    </p>

                </form>

            </td>
        </tr>

    </table>

    <!-- External JavaScript -->
    <script src="C:\Users\shahm\OneDrive\Desktop\Student Hub Portal\JavaScript\script.js"></script>

</body>

</html>
