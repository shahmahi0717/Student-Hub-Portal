<!DOCTYPE html>
<html>

<head>
    <title>Login - StudentHub Portal</title>
    <link rel="stylesheet" href="../Style css/style.css">
</head>

<body>

    <table width="100%" height="100%">

        <tr>

            <td align="center" valign="middle">

                <h1>StudentHub Portal</h1>

                <p>Welcome back! Please login to continue.</p>

                <table border="1" cellpadding="25" width="420">

                    <tr>

                        <td>

                            <form id="loginForm">

                                <label>Email Address</label>

                                <br>

                                <input
    type="email"
    id="loginEmail"
    size="45"
    required
>

                                <br>

                                <label>Password</label>

                                <br>

                               <input
    type="password"
    id="loginPassword"
    size="45"
    required
>

                                <br>

                                <label>
    <a href="forgotpassword.html">
    Forgot Password?
</a>

<br>

<div align="center">
    <label>
        <input type="checkbox">
        Remember Me
    </label>
</div>

<br>

                                <button type="submit" style="width:100%;">
                                    Login
                                </button>

                                <br><br>

                                <p align="center">

                                    Don't have an account?

                                    <a href="register.html">
                                        Sign Up
                                    </a>

                                </p>

                            </form>

                        </td>

                    </tr>

                </table>

            </td>

        </tr>

    </table>
<script src="../JavaScript/script.js"></script>
<script src="../JavaScript/studentData.js"></script>

<script>

document.addEventListener(
    "DOMContentLoaded",
    async function() {

        /*
           Make sure students.json
           has been loaded.
        */

        await initializeStudentData();


        const loginForm =
            document.getElementById(
                "loginForm"
            );


        if (!loginForm) {
            return;
        }


        loginForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById(
                            "loginEmail"
                        )
                        .value
                        .trim();


                const password =
                    document
                        .getElementById(
                            "loginPassword"
                        )
                        .value;


                const result =
                    loginStudent(
                        email,
                        password
                    );


                if (result.success) {

                    alert(
                        "Login successful!"
                    );

                    window.location.href =
                        "dashboard.html";

                } else {

                    alert(
                        result.message
                    );

                }

            }
        );

    }
);

</script>

</body>

</html>
