<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Student Hub Portal</title>
    <link rel="stylesheet" href="C:\Users\shahm\OneDrive\Desktop\Student Hub Portal\Style css\style.css">
</head>

<body>

<div class="standalone-page">

   <main class="full-width" style="width: 100%; max-width: 1200px; margin: 0 auto; padding: 25px; box-sizing: border-box;">

        <!-- ============== TOP BAR ============== -->
        <div class="topbar">
            <div>
                <h1>Contact</h1>
                <p>Get in touch with us or find quick answers.</p>
            </div>
        </div>

        <!-- ============== CONTACT FORM ============== -->
        <div class="card">

            <h2>Contact Form</h2>
            <br>

            <form action="submit-contact.html" method="post" class="contact-form">

                <div class="form-field">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-field">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" required>
                </div>

                <div class="form-field">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <button type="submit">Submit</button>

            </form>

        </div>

        <br>

        <!-- ============== FAQ SECTION ============== -->
        <div class="card">

            <h2>FAQ Section</h2>
            <br>

            <p><a href="faqs.html">View Frequently Asked Questions</a></p>
            <p><a href="faqs.html">Find answers to common student queries</a></p>

        </div>

        <br>

        <!-- ============== CONTACT INFORMATION ============== -->
        <div class="card">

            <h2>Contact Information</h2>
            <br>

            <p>Address: Student Hub Campus</p>
            <p>Phone: +91 XXXXX XXXXX</p>
            <p>Email: support@studenthub.com</p>

        </div>

        <br>

        <!-- ============== PAGE LINKS ============== -->
        <div class="card">
            <h2>Quick Links</h2>
            <br>
            <div class="quick-links quick-links-center">
                <a href="home.html" class="quick-link-btn">🏠 Home</a>
                <a href="contact.html" class="quick-link-btn">✉️ Contact</a>
            </div>
        </div>


    </main>

</div>

</body>

</html>
