<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results - Student Hub Portal</title>
    <link rel="stylesheet" href="C:\Users\shahm\OneDrive\Desktop\Student Hub Portal\Style css\style.css">
</head>

<body>

<div class="dashboard">

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>StudentHub</h2>
        </div>
        <nav class="sidebar-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="profile.html">Profile</a>
            <a href="attendance.html">Attendance</a>
            <a href="courses.html">Courses</a>
            <a href="assignments.html">Assignments</a>
            <a href="studymaterials.html">Study Material</a>
            <a href="timetable.html">Timetable</a>
            <a href="results.html" class="active">Results</a>
            <a href="library.html">Library</a>
            <a href="placement.html">Placement</a>
            <a href="noticeboard.html">Notice Board</a>
        </nav>
        <div class="sidebar-footer">
            <a href="logout.html">Logout</a>
        </div>
    </aside>

    <main class="main-content" id="mainContent">

        <div class="topbar">
            <div style="display:flex; align-items:center; gap:15px;">
                <button id="sidebarToggle" class="toggle-btn" aria-label="Toggle sidebar">&#9776;</button>
                <div>
                    <h1>Results</h1>
                    <p>View your semester-wise marks and grades.</p>
                </div>
            </div>
            <div style="display:flex; align-items:right; gap:20px;">
                <a href="notifications.html">🔔 Notifications</a>
            </div>
        </div>

        <!-- ============== SELECT SEMESTER ============== -->
        <div class="card">
            <div class="form-field" style="max-width:260px;">
                <label for="semester">Select Semester</label>
                <select id="semester" name="semester">
                    <option value="">Select Semester</option>
                    <option value="1">Semester 1</option>
                    <option value="2">Semester 2</option>
                    <option value="3">Semester 3</option>
                    <option value="4">Semester 4</option>
                    <option value="5">Semester 5</option>
                    <option value="6">Semester 6</option>
                    <option value="7">Semester 7</option>
                    <option value="8">Semester 8</option>
                </select>
            </div>
        </div>

        <br>

        <!-- ============== RESULTS TABLE ============== -->
        <div class="card">

            <table class="styled-table" width="100%">
                <tr>
                    <th>Subject</th>
                    <th>Marks</th>
                    <th>Grade</th>
                    <th>Credits</th>
                </tr>
                <tr>
                    <td>Subject 1</td>
                    <td>85</td>
                    <td>A</td>
                    <td>4</td>
                </tr>
                <tr>
                    <td>Subject 2</td>
                    <td>72</td>
                    <td>B+</td>
                    <td>3</td>
                </tr>
            </table>

        </div>

        <br>

        <!-- ============== SGPA / CGPA ============== -->
        <div class="dashboard-grid">

            <div class="dashboard-card">
                <h2>8.5</h2>
                <h3>SGPA</h3>
            </div>

            <div class="dashboard-card">
                <h2>8.2</h2>
                <h3>CGPA</h3>
            </div>

        </div>

        <br>

        <!-- ============== DOWNLOAD MARKSHEET ============== -->
        <a href="marksheet.pdf" download>
            <button type="button">Download Marksheet</button>
        </a>

    </main>

</div>

<script>
    const sidebar = document.getElementById('sidebar');
    const mainContent = document.getElementById('mainContent');
    const toggleBtn = document.getElementById('sidebarToggle');

    toggleBtn.addEventListener('click', () => {
        sidebar.classList.toggle('collapsed');
        mainContent.classList.toggle('expanded');
    });
</script>

</body>

</html>
